[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38-gdn-dual-sequence-output-tail"
version = "0.1.0"
description = "Evidence-bound Qwen3.8 GDN native optimization mod"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["jsonschema>=4.23", "pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
